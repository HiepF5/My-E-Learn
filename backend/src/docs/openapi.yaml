openapi: 3.0.3
info:
  title: MY LEARN E API
  version: 1.0.0
  description: Backend API documentation for MY LEARN E.
x-json-convention:
  case: snake_case
  applies_to: request_body_and_response_body
  note: Clients (web-admin, mobile-app) should consume snake_case fields directly.
servers:
  - url: http://localhost:5000
tags:
  - name: Health
  - name: Auth
  - name: Topics
  - name: Vocabulary
  - name: Content
  - name: Review
  - name: Errors
  - name: AI
  - name: Streak
  - name: Weak words
  - name: Speaking
  - name: Writing
  - name: AI Feedback
  - name: Devices
  - name: Learning
  - name: Me
  - name: Favorites
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessHealth"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/topics:
    get:
      tags: [Topics]
      summary: List topics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Topics]
      summary: Create topic
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpsertRequest"
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/topics/today:
    get:
      tags: [Topics]
      summary: Today mission (primary topic, plan counts, review due)
      description: >-
        Aggregates the rule-based today plan (same inputs as AI generate-today-plan) with live
        review-due count and error-notebook summary for mobile home and topic screens.
      security:
        - bearerAuth: []
      parameters:
        - name: daily_target_words
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
        - name: review_cap
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Today mission snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayMissionResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/topics/{id}:
    get:
      tags: [Topics]
      summary: Get topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Topics]
      summary: Update topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpsertRequest"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Topics]
      summary: Delete topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary:
    get:
      tags: [Vocabulary]
      summary: List vocabulary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vocabulary list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Vocabulary]
      summary: Create vocabulary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyUpsertRequest"
      responses:
        "201":
          description: Vocabulary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/vocabulary/sync:
    get:
      tags: [Vocabulary]
      summary: List vocabulary rows created or updated after a cursor (offline delta)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: since
          required: false
          description: ISO8601 timestamp; omit for full list equivalent
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Items plus sync_cursor for next delta pull
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularySyncResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/me/learning-state:
    get:
      tags: [Me]
      summary: Get learning session hints (resume review)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current saved state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStateResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Me]
      summary: Update learning session hints
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LearningStatePatchRequest"
      responses:
        "200":
          description: Updated state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningStateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/favorites:
    get:
      tags: [Favorites]
      summary: List favorite words with labels
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Favorites list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Favorites]
      summary: Add word to favorites
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [word_id]
              properties:
                word_id:
                  type: integer
      responses:
        "201":
          description: Created or already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessDataObject"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/favorites/check/{wordId}:
    get:
      tags: [Favorites]
      summary: Check if word is favorited
      security:
        - bearerAuth: []
      parameters:
        - name: wordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Favorite flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FavoriteCheckResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/favorites/{wordId}:
    delete:
      tags: [Favorites]
      summary: Remove word from favorites
      security:
        - bearerAuth: []
      parameters:
        - name: wordId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}/note:
    get:
      tags: [Vocabulary]
      summary: Get personal note for a word
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Note payload (null text if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyNoteResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Vocabulary]
      summary: Save personal note (empty string deletes)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyNotePutRequest"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyNoteResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Vocabulary]
      summary: Delete personal note
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}:
    get:
      tags: [Vocabulary]
      summary: Get vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Vocabulary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}/collocations:
    get:
      tags: [Content]
      summary: List collocations for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Collocations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollocationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Create collocation for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollocationRequest"
      responses:
        "201":
          description: Collocation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollocationItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/vocabulary/{id}/collocations/{collocationId}:
    delete:
      tags: [Content]
      summary: Delete collocation by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
        - $ref: "#/components/parameters/CollocationId"
      responses:
        "200":
          description: Collocation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}/word-family:
    get:
      tags: [Content]
      summary: List word family for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Word family list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFamilyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Create word family item for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordFamilyRequest"
      responses:
        "201":
          description: Word family item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFamilyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/vocabulary/{id}/word-family/{wordFamilyId}:
    delete:
      tags: [Content]
      summary: Delete word family item by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
        - $ref: "#/components/parameters/WordFamilyId"
      responses:
        "200":
          description: Word family item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Vocabulary]
      summary: Update vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyUpsertRequest"
      responses:
        "200":
          description: Vocabulary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Vocabulary]
      summary: Delete vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Vocabulary deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/review/today:
    get:
      tags: [Review]
      summary: Review queue for today
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          description: >
            Daily cap for due review items. If omitted, server uses 30.
            Values outside 1..100 are clamped to the nearest valid value.
      responses:
        "200":
          description: Due review items ordered by wrong_count and next_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTodayResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/review/submit:
    post:
      tags: [Review]
      summary: Submit review result
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmitRequest"
      responses:
        "200":
          description: Review result applied and history created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/review/touch/{wordId}:
    get:
      tags: [Review]
      summary: Get touch history for a word
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WordId"
      responses:
        "200":
          description: Touch history by user and word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TouchHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Review]
      summary: Update one touch step (1/2/3)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TouchPatchRequest"
      responses:
        "200":
          description: Touch step updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TouchHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors:
    get:
      tags: [Errors]
      summary: List error notebook items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Error notebook list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Errors]
      summary: Create error notebook item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorNotebookRequest"
      responses:
        "201":
          description: Error notebook item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/errors/top-repeated:
    get:
      tags: [Errors]
      summary: Top repeated errors for dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Top repeated errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/errors/{id}:
    put:
      tags: [Errors]
      summary: Update error notebook item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorNotebookRequest"
      responses:
        "200":
          description: Error notebook item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Errors]
      summary: Delete error notebook item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      responses:
        "200":
          description: Error notebook item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/{id}/fixed:
    patch:
      tags: [Errors]
      summary: Update fixed status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fixed:
                  type: boolean
              required: [fixed]
      responses:
        "200":
          description: Fixed status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/{id}/repeat:
    patch:
      tags: [Errors]
      summary: Increment repeat count
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      responses:
        "200":
          description: Repeat count incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/tags:
    get:
      tags: [Errors]
      summary: List available error tags
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Error tags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Errors]
      summary: Create error tag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
              required: [tag_name]
      responses:
        "201":
          description: Error tag created
