openapi: 3.0.3
info:
  title: MY LEARN E API
  version: 1.0.0
  description: Backend API documentation for MY LEARN E.
x-json-convention:
  case: snake_case
  applies_to: request_body_and_response_body
  note: Clients (web-admin, mobile-app) should consume snake_case fields directly.
servers:
  - url: http://localhost:5000
tags:
  - name: Health
  - name: Auth
  - name: Topics
  - name: Vocabulary
  - name: Content
  - name: Review
  - name: Errors
  - name: AI
paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        "200":
          description: Server is running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessHealth"

  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/topics:
    get:
      tags: [Topics]
      summary: List topics
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Topic list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Topics]
      summary: Create topic
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpsertRequest"
      responses:
        "201":
          description: Topic created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/topics/{id}:
    get:
      tags: [Topics]
      summary: Get topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Topics]
      summary: Update topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TopicUpsertRequest"
      responses:
        "200":
          description: Topic updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopicItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Topics]
      summary: Delete topic by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TopicId"
      responses:
        "200":
          description: Topic deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary:
    get:
      tags: [Vocabulary]
      summary: List vocabulary
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Vocabulary list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Vocabulary]
      summary: Create vocabulary
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyUpsertRequest"
      responses:
        "201":
          description: Vocabulary created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/vocabulary/{id}:
    get:
      tags: [Vocabulary]
      summary: Get vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Vocabulary detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}/collocations:
    get:
      tags: [Content]
      summary: List collocations for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Collocations list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollocationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Create collocation for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollocationRequest"
      responses:
        "201":
          description: Collocation created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollocationItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/vocabulary/{id}/collocations/{collocationId}:
    delete:
      tags: [Content]
      summary: Delete collocation by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
        - $ref: "#/components/parameters/CollocationId"
      responses:
        "200":
          description: Collocation deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/vocabulary/{id}/word-family:
    get:
      tags: [Content]
      summary: List word family for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Word family list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFamilyListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Content]
      summary: Create word family item for a vocabulary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WordFamilyRequest"
      responses:
        "201":
          description: Word family item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WordFamilyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/vocabulary/{id}/word-family/{wordFamilyId}:
    delete:
      tags: [Content]
      summary: Delete word family item by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
        - $ref: "#/components/parameters/WordFamilyId"
      responses:
        "200":
          description: Word family item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Vocabulary]
      summary: Update vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VocabularyUpsertRequest"
      responses:
        "200":
          description: Vocabulary updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VocabularyItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Vocabulary]
      summary: Delete vocabulary by id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/VocabularyId"
      responses:
        "200":
          description: Vocabulary deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/review/today:
    get:
      tags: [Review]
      summary: Review queue for today
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
          required: false
          description: >
            Daily cap for due review items. If omitted, server uses 30.
            Values outside 1..100 are clamped to the nearest valid value.
      responses:
        "200":
          description: Due review items ordered by wrong_count and next_review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewTodayResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/review/submit:
    post:
      tags: [Review]
      summary: Submit review result
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmitRequest"
      responses:
        "200":
          description: Review result applied and history created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSubmitResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/review/touch/{wordId}:
    get:
      tags: [Review]
      summary: Get touch history for a word
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WordId"
      responses:
        "200":
          description: Touch history by user and word
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TouchHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Review]
      summary: Update one touch step (1/2/3)
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/WordId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TouchPatchRequest"
      responses:
        "200":
          description: Touch step updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TouchHistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors:
    get:
      tags: [Errors]
      summary: List error notebook items
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Error notebook list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Errors]
      summary: Create error notebook item
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorNotebookRequest"
      responses:
        "201":
          description: Error notebook item created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/errors/top-repeated:
    get:
      tags: [Errors]
      summary: Top repeated errors for dashboard
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Top repeated errors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/errors/{id}:
    put:
      tags: [Errors]
      summary: Update error notebook item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ErrorNotebookRequest"
      responses:
        "200":
          description: Error notebook item updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Errors]
      summary: Delete error notebook item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      responses:
        "200":
          description: Error notebook item deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessMessageOnly"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/{id}/fixed:
    patch:
      tags: [Errors]
      summary: Update fixed status
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fixed:
                  type: boolean
              required: [fixed]
      responses:
        "200":
          description: Fixed status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/{id}/repeat:
    patch:
      tags: [Errors]
      summary: Increment repeat count
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      responses:
        "200":
          description: Repeat count incremented
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorNotebookItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/errors/tags:
    get:
      tags: [Errors]
      summary: List available error tags
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Error tags list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTagListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Errors]
      summary: Create error tag
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_name:
                  type: string
              required: [tag_name]
      responses:
        "201":
          description: Error tag created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTagItemResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /api/errors/{id}/tags:
    get:
      tags: [Errors]
      summary: Get tags mapped to one error item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      responses:
        "200":
          description: Error tag mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTagMapResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Errors]
      summary: Replace tags for one error item
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ErrorId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tag_ids:
                  type: array
                  items:
                    type: integer
              required: [tag_ids]
      responses:
        "200":
          description: Error tag mapping updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorTagMapResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/ai/generate-today-plan:
    post:
      tags: [AI]
      summary: Generate today learning plan (rule-based, no LLM)
      description: >
        Uses priority scoring, false-master heuristic, and error-pattern weights
        from the user's notebook and review progress. Does not call external AI APIs.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GenerateTodayPlanRequest"
      responses:
        "200":
          description: Plan JSON with topic, counts, mistake_focus, weak_word_ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GenerateTodayPlanResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TopicId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Topic id
    VocabularyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Vocabulary id
    CollocationId:
      name: collocationId
      in: path
      required: true
      schema:
        type: integer
      description: Collocation id
    WordFamilyId:
      name: wordFamilyId
      in: path
      required: true
      schema:
        type: integer
      description: Word family item id
    WordId:
      name: wordId
      in: path
      required: true
      schema:
        type: integer
      description: Word id
    ErrorId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Error notebook id

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    GenerateTodayPlanRequest:
      type: object
      properties:
        daily_target_words:
          type: integer
          minimum: 1
          maximum: 50
          description: Target new words for the day (default 10 in engine)
        review_cap:
          type: integer
          minimum: 1
          maximum: 100
          description: Target size for review queue (aligns with GET /api/review/today limit)

    MistakeFocusItem:
      type: object
      properties:
        error_type:
          type: string
        weight:
          type: number
      required: [error_type, weight]

    TodayPlanMeta:
      type: object
      properties:
        rule_engine_version:
          type: string
        llm:
          type: boolean
      required: [rule_engine_version, llm]

    TodayPlanPayload:
      type: object
      properties:
        topic:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            topic_name:
              type: string
            level:
              type: string
              nullable: true
        counts:
          type: object
          properties:
            new_words_target:
              type: integer
            review_queue_target:
              type: integer
            touch_focus:
              type: integer
        mistake_focus:
          type: array
          items:
            $ref: "#/components/schemas/MistakeFocusItem"
        weak_word_ids:
          type: array
          items:
            type: integer
        false_master_word_ids:
          type: array
          items:
            type: integer
        priority_preview:
          type: array
          items:
            type: object
            properties:
              word_id:
                type: integer
              priority_score:
                type: number
        meta:
          $ref: "#/components/schemas/TodayPlanMeta"

    GenerateTodayPlanData:
      type: object
      properties:
        generated_at:
          type: string
          format: date-time
        today_plan:
          $ref: "#/components/schemas/TodayPlanPayload"
      required: [generated_at, today_plan]

    GenerateTodayPlanResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/GenerateTodayPlanData"
        message:
          type: string
      required: [success, data, message]

    TopicUpsertRequest:
      type: object
      properties:
        topic_name:
          type: string
        description:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
      required: [topic_name]

    TopicItem:
      type: object
      properties:
        id:
          type: integer
        topic_name:
          type: string
        description:
          type: string
          nullable: true
        level:
          type: string
          nullable: true
      required: [id, topic_name]

    TopicItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/TopicItem"
        message:
          type: string
      required: [success, data, message]

    TopicListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/TopicItem"
        message:
          type: string
      required: [success, data, message]

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        data:
          nullable: true
        message:
          type: string
