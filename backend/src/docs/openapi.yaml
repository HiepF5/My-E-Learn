components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TopicId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Topic id
    VocabularyId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Vocabulary id
    CollocationId:
      name: collocationId
      in: path
      required: true
      schema:
        type: integer
      description: Collocation id
    WordFamilyId:
      name: wordFamilyId
      in: path
      required: true
      schema:
        type: integer
      description: Word family item id
    WordId:
      name: wordId
      in: path
      required: true
      schema:
        type: integer
      description: Word id
    ErrorId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Error notebook id

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden — authenticated but missing required role (e.g. vocabulary/topic writes require ADMIN)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StreakCurrent:
      type: object
      properties:
        current_streak:
          type: integer
        best_streak:
          type: integer
        last_study_date:
          type: string
          format: date
          nullable: true
      required: [current_streak, best_streak]

    StreakCurrentResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/StreakCurrent"
        message:
          type: string
      required: [success, data, message]

    StreakHeatmapItem:
      type: object
      properties:
        study_date:
          type: string
          format: date
        did_study:
          type: boolean
      required: [study_date, did_study]

    StreakHeatmapResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/StreakHeatmapItem"
        message:
          type: string
      required: [success, data, message]

    WeakWordItem:
      type: object
      properties:
        word_id:
          type: integer
        weak_score:
          type: number
          format: float
        wrong_count_snapshot:
          type: integer
        correct_count_snapshot:
          type: integer
        recent_wrong_count:
          type: integer
          description: Wrong answers in review_history in the last 14 days
        last_computed_at:
          type: string
          format: date-time
      required:
        - word_id
        - weak_score
        - wrong_count_snapshot
        - correct_count_snapshot
        - recent_wrong_count
        - last_computed_at

    WeakWordsListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/WeakWordItem"
        message:
          type: string
      required: [success, data, message]

    SpeakingRecordItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        word_id:
          type: integer
          nullable: true
        prompt_text:
          type: string
          nullable: true
        transcript_text:
          type: string
          nullable: true
        audio_url:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required: [id, user_id]

    SpeakingRecordCreateRequest:
      type: object
      properties:
        word_id:
          type: integer
        prompt_text:
          type: string
        transcript_text:
          type: string
        audio_url:
          type: string
        score:
          type: number
        reviewed_at:
          type: string
          format: date-time

    SpeakingRecordItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/SpeakingRecordItem"
        message:
          type: string
      required: [success, data, message]

    SpeakingRecordListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/SpeakingRecordItem"
        message:
          type: string
      required: [success, data, message]

    WritingRecordItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        word_id:
          type: integer
          nullable: true
        prompt_text:
          type: string
          nullable: true
        written_text:
          type: string
          nullable: true
        corrected_text:
          type: string
          nullable: true
        score:
          type: number
          nullable: true
        reviewed_at:
          type: string
          format: date-time
          nullable: true
      required: [id, user_id]

    WritingRecordCreateRequest:
      type: object
      properties:
        word_id:
          type: integer
        prompt_text:
          type: string
        written_text:
          type: string
        corrected_text:
          type: string
        score:
          type: number
        reviewed_at:
          type: string
          format: date-time

    WritingRecordItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/WritingRecordItem"
        message:
          type: string
      required: [success, data, message]

    WritingRecordListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/WritingRecordItem"
        message:
          type: string
      required: [success, data, message]

    AiFeedbackItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        source_type:
          type: string
          enum: [speaking, writing, general]
        source_id:
          type: integer
          nullable: true
        feedback_text:
          type: string
        suggestions:
          type: string
          nullable: true
        model_name:
          type: string
          nullable: true
      required: [id, user_id, source_type, feedback_text]

    AiFeedbackCreateRequest:
      type: object
      description: >-
        Either provide feedback_text manually, or set generate_llm to true with learner_text to
        generate feedback via OpenAI (requires OPENAI_API_KEY on the server).
      properties:
        source_type:
          type: string
          enum: [speaking, writing, general]
        source_id:
          type: integer
        feedback_text:
          type: string
          description: Required when generate_llm is not true.
        suggestions:
          type: string
        model_name:
          type: string
        generate_llm:
          type: boolean
          description: When true, learner_text is sent to the LLM and feedback_text is generated.
        learner_text:
          type: string
          description: Learner content to review when generate_llm is true.

    AiFeedbackItemResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: "#/components/schemas/AiFeedbackItem"
        message:
          type: string
      required: [success, data, message]

    AiFeedbackListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiFeedbackItem"
        message:
          type: string
      required: [success, data, message]

    AiErrorPatternItem:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        pattern_name:
          type: string
        error_count:
          type: integer
        last_detected_at:
          type: string
          format: date-time
          nullable: true
      required: [id, user_id, pattern_name, error_count]

    AiErrorPatternListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/AiErrorPatternItem"
        message:
          type: string
      required: [success, data, message]

    GenerateTodayPlanRequest:
      type: object
      properties:
        daily_target_words:
          type: integer
          minimum: 1
          maximum: 50
          description: Target new words for the day (default 10 in engine)
        review_cap:
          type: integer
          minimum: 1
          maximum: 100
          description: Target size for review queue (aligns with GET /api/review/today limit)

    MistakeFocusItem:
      type: object
      properties:
        error_type:
          type: string
        weight:
          type: number
      required: [error_type, weight]

    TodayPlanMeta:
      type: object
      properties:
        rule_engine_version:
          type: string
        llm:
          type: boolean
      required: [rule_engine_version, llm]

    TodayPlanPayload:
      type: object
      properties:
        topic:
          type: object
          nullable: true
          properties:
            id:
              type: integer
            topic_name:
              type: string
            level:
              type: string
