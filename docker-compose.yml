services:
  mysql:
    image: mysql:8.4
    container_name: mylearne-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-mylearne}
      MYSQL_USER: ${DB_USER:-mylearne}
      MYSQL_PASSWORD: ${DB_PASS:-mylearne_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASS:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mylearne-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: ${PORT:-5000}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-mylearne}
      DB_USER: ${DB_USER:-mylearne}
      DB_PASS: ${DB_PASS:-mylearne_password}
      JWT_SECRET: ${JWT_SECRET:-dev_secret_change_me}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

volumes:
  mysql_data:
